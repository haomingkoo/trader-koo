name: Production freshness

# Alerts from outside the Railway container. A failed scheduled run emails the
# workflow owner. GitHub delays cron and disables schedules after 60 days of
# repository inactivity, so pair this with an external uptime monitor and
# Railway deployment notifications.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prod-freshness
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check health and price freshness
        env:
          BASE_URL: ${{ vars.TRADER_KOO_PRODUCTION_URL }}
        run: python ops/check_prod_freshness.py --base-url "$BASE_URL"
