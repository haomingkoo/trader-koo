name: Mutation

on:
  pull_request:
  workflow_dispatch:
    inputs:
      paths:
        description: "Space-separated Python sources to score instead of the PR diff"
        required: false
      functions:
        description: "With paths: space-separated mangled functions to score (x_name, xǁClassǁmethod)"
        required: false

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changed-modules:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements-dev.txt
            requirements-mutation.txt

      # No editable install: tests must import the mutated copy under mutants/.
      - name: Install backend dependencies and mutmut
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -r requirements-mutation.txt

      - name: Mutation-test the Python code this PR changed or its edited tests reach
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
          INPUT_PATHS: ${{ inputs.paths }}
          INPUT_FUNCTIONS: ${{ inputs.functions }}
        run: |
          if [ -n "$INPUT_PATHS" ] && [ -n "$INPUT_FUNCTIONS" ]; then
            # shellcheck disable=SC2086
            python ops/mutation_gate.py --paths $INPUT_PATHS --functions $INPUT_FUNCTIONS --threshold 80
          elif [ -n "$INPUT_PATHS" ]; then
            # shellcheck disable=SC2086
            python ops/mutation_gate.py --paths $INPUT_PATHS --threshold 80
          else
            python ops/mutation_gate.py --base "origin/$BASE_REF" --threshold 80
          fi
