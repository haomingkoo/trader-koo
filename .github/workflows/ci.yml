name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repo-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install backend tooling
        run: make backend-install

      - name: Run pre-commit
        run: make precommit

  dependency-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Install lock tooling
        run: make lock-tools PYTHON=python

      - name: Check the hashed locks match their inputs
        run: make lock-check PYTHON=python

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install backend dependencies
        run: make backend-install

      - name: Compile Python sources
        run: make backend-check

      - name: Run backend tests
        run: make test

  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: trader_koo/frontend-v2
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: trader_koo/frontend-v2/.nvmrc
          cache: "npm"
          cache-dependency-path: trader_koo/frontend-v2/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit all frontend dependencies
        run: npm audit --audit-level=high

      - name: Lint frontend
        run: npm run lint

      - name: Run frontend unit tests in supported timezones
        run: npm test
        env:
          TZ: ${{ matrix.timezone }}

      - name: Build frontend
        run: npm run build

    strategy:
      fail-fast: false
      matrix:
        timezone: [UTC, Asia/Singapore, America/Los_Angeles]

  security-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install backend dependencies
        run: make backend-install

      - name: Run auth, audit, redaction, and property contracts
        run: >-
          python -m pytest -q
          tests/test_admin_auth.py
          tests/test_audit_integration.py
          tests/test_audit_logging.py
          tests/test_cors_property.py
          tests/test_llm_validator_property.py
          tests/test_secret_redaction.py
          tests/test_secret_redaction_property.py

  release-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install backend dependencies
        run: make backend-install

      - name: Create migration fixture
        run: sqlite3 /tmp/release-source.db 'CREATE TABLE release_seed(id INTEGER PRIMARY KEY);'

      - name: Build migration, replay, and backtest evidence
        run: >-
          python -m trader_koo.scripts.release_evidence
          --source-db /tmp/release-source.db
          --output-dir release-evidence

      - name: Upload immutable release evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-${{ github.sha }}
          path: |
            release-evidence/*.json
          if-no-files-found: error
          retention-days: 30

  browser-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: trader_koo/frontend-v2
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: trader_koo/frontend-v2/.nvmrc
          cache: "npm"
          cache-dependency-path: trader_koo/frontend-v2/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install backend dependencies
        working-directory: .
        run: make backend-install

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium for browser contract tests
        run: npx playwright install --with-deps chromium

      - name: Run browser contract tests
        run: npm run test:e2e
