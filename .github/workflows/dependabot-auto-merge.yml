name: Dependabot auto-merge

# Patch and minor bumps merge on their own once the required checks pass; majors wait for a person.
# The merge uses a personal token, not GITHUB_TOKEN, so the push to main still runs the deploy workflows.
on: pull_request

permissions:
  contents: read

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Turn on auto-merge
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: |
          # A merge redeploys, and a redeploy kills the daily report (06:00 to 08:00 UTC).
          # CI plus the dark deploy can take an hour, so nothing is queued from 05:00.
          hour=$(date -u +%H)
          if [ "$hour" -ge 5 ] && [ "$hour" -lt 8 ]; then
            echo "::notice::Report window; merge this PR by hand after 08:00 UTC."
            exit 0
          fi
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.DEPENDABOT_MERGE_TOKEN }}
