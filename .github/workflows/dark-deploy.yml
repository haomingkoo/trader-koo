name: Dark deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: production-dark
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  dark-deploy:
    # Only a CI run for a push to this repository's main may deploy; a fork
    # pull request can also complete the CI workflow.
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_branch == 'main'
        && github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    # Install 25 + upload 25 + record 20 + rollback 25 + 15 for the other
    # steps. A job timeout skips cleanup, so the rollback must fit inside it.
    timeout-minutes: 110
    environment:
      name: production-dark
      url: ${{ vars.TRADER_KOO_PRODUCTION_URL }}
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
      RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT }}
      BASE_URL: ${{ vars.TRADER_KOO_PRODUCTION_URL }}
      ADMIN_API_KEY: ${{ secrets.TRADER_KOO_API_KEY }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      # 180 polls x 5 s = 900 s: the 600 s Railway health check plus margin.
      DEPLOYMENT_POLL_ATTEMPTS: "180"
      ROLLBACK_POLL_ATTEMPTS: "180"
      ROLLBACK_NEW_DEPLOYMENT_GRACE_POLLS: "12"
      DEPLOYMENT_POLL_INTERVAL_SEC: "5"
      # Wait up to 15 minutes for a running pipeline before refusing.
      PIPELINE_WAIT_ATTEMPTS: "30"
      PIPELINE_WAIT_INTERVAL_SEC: "30"
    steps:
      - name: Check out the exact CI commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: trader_koo/frontend-v2/package-lock.json

      - name: Install release tooling
        timeout-minutes: 25
        run: |
          make backend-install
          npm ci --prefix trader_koo/frontend-v2
          npx --prefix trader_koo/frontend-v2 playwright install --with-deps chromium
          npm install --global @railway/cli@5.27.0

      - name: Verify exact Railway project-token scope
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --url https://backboard.railway.com/graphql/v2 \
            --header "Project-Access-Token: ${RAILWAY_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"query":"query { projectToken { projectId environmentId } }"}' \
            --output /tmp/railway-token-scope.json
          jq -e \
            --arg project "$RAILWAY_PROJECT_ID" \
            --arg environment "$RAILWAY_ENVIRONMENT" \
            '.data.projectToken.projectId == $project and
             .data.projectToken.environmentId == $environment' \
            /tmp/railway-token-scope.json \
            > /dev/null

      - name: Refuse a Railway GitHub autodeploy bypass
        run: |
          railway environment config --environment "$RAILWAY_ENVIRONMENT" --json \
            | jq -e --arg service "$RAILWAY_SERVICE" \
            '.services[$service].source.repo == null' \
            > /dev/null

      - name: Create and download a fresh consistent production backup
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "X-API-Key: ${ADMIN_API_KEY}" \
            "${BASE_URL}/api/admin/backups" \
            --output /tmp/backup-created.json
          jq -e '.ok == true and (.backup_name | length > 0) and (.sha256 | length == 64) and .dest_size_bytes > 0' /tmp/backup-created.json > /dev/null
          backup_name=$(jq -r '.backup_name' /tmp/backup-created.json)
          backup_sha=$(jq -r '.sha256' /tmp/backup-created.json)
          backup_size=$(jq -r '.dest_size_bytes' /tmp/backup-created.json)
          mkdir -p release-evidence
          jq '{schema: "production-backup-v1", backup_name, sha256, dest_size_bytes}' \
            /tmp/backup-created.json > release-evidence/production-backup-manifest.json
          curl --fail --silent --show-error \
            --header "X-API-Key: ${ADMIN_API_KEY}" \
            "${BASE_URL}/api/admin/backups/${backup_name}" \
            --output /tmp/production-backup.db.gz
          test "$(wc -c < /tmp/production-backup.db.gz | tr -d ' ')" = "$backup_size"
          test "$(sha256sum /tmp/production-backup.db.gz | cut -d' ' -f1)" = "$backup_sha"

      - name: Verify migrations and replay against the production copy
        run: >-
          python -m trader_koo.scripts.release_evidence
          --source-db /tmp/production-backup.db.gz
          --output-dir release-evidence

      - name: Record previous verified deployment
        id: previous
        run: |
          umask 077
          railway deployment list --json --limit 20 --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT" > /tmp/previous-deployments.json
          railway variable list --json --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT" > /tmp/previous-variables.json
          paper_trade_enabled=$(jq -er '.TRADER_KOO_PAPER_TRADE_ENABLED | select(. == "0" or . == "1")' /tmp/previous-variables.json)
          deployment_id=$(jq -r '[.[] | select(.status == "SUCCESS")][0].id // empty' /tmp/previous-deployments.json)
          curl --fail --silent --show-error "${BASE_URL}/api/release" > /tmp/previous-release.json
          release_sha=$(jq -r '.git_sha // empty' /tmp/previous-release.json)
          curl --fail --silent --show-error "${BASE_URL}/api/paper-trades/summary" > /tmp/previous-paper-summary.json
          jq -e '.ok == true' /tmp/previous-paper-summary.json > /dev/null
          campaign_status=$(jq -r '.campaign_health.status // "absent"' /tmp/previous-paper-summary.json)
          observed_write_state=$(jq -r '.campaign_health.write_state // "absent"' /tmp/previous-paper-summary.json)
          case "$campaign_status" in active|draft|frozen|absent) ;; *) exit 1 ;; esac
          if [ "$paper_trade_enabled" = "1" ]; then
            expected_write_state=enabled
          else
            expected_write_state=paused
          fi
          if [ "$campaign_status" = "absent" ]; then
            test "$observed_write_state" = "absent"
            test "$paper_trade_enabled" = "0"
          else
            test "$observed_write_state" = "$expected_write_state"
          fi
          test -n "$deployment_id"
          test -n "$release_sha"
          echo "id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "campaign_status=$campaign_status" >> "$GITHUB_OUTPUT"
          echo "campaign_write_state=$expected_write_state" >> "$GITHUB_OUTPUT"
          echo "paper_trade_enabled=$paper_trade_enabled" >> "$GITHUB_OUTPUT"

      - name: Refuse a stale or non-descendant release
        env:
          PREVIOUS_SHA: ${{ steps.previous.outputs.sha }}
        run: |
          # A re-run of an old workflow must not push an older commit.
          main_head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$main_head" != "$RELEASE_SHA" ]; then
            echo "Release ${RELEASE_SHA} is not the current main head (${main_head:-unknown}); refusing to deploy it."
            exit 1
          fi
          if ! git cat-file -e "${PREVIOUS_SHA}^{commit}" 2>/dev/null; then
            echo "Production SHA ${PREVIOUS_SHA} is not in the repository history; refusing to deploy over it."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$PREVIOUS_SHA" "$RELEASE_SHA"; then
            echo "Production SHA ${PREVIOUS_SHA} is not an ancestor of ${RELEASE_SHA}; refusing to deploy."
            exit 1
          fi

      - name: Refuse a restart during the nightly pipeline
        run: |
          # daily_update runs at 22:00 UTC Mon-Fri (backend/services/scheduler.py)
          # and took about 35 minutes. The restart lands 10-25 minutes after
          # this check, so 21:15-23:15 UTC on weekdays is closed; after that
          # pipeline_active covers an overrun.
          for attempt in $(seq 1 "$PIPELINE_WAIT_ATTEMPTS"); do
            now=$(date -u '+%u %H%M')
            weekday=${now% *}
            hhmm=$((10#${now#* }))
            if [ "$weekday" -le 5 ] && [ "$hhmm" -ge 2115 ] && [ "$hhmm" -lt 2315 ]; then
              echo "Refusing to restart production inside the weekday nightly window (21:15-23:15 UTC, now ${now})."
              exit 1
            fi
            curl --fail --silent --show-error "${BASE_URL}/api/status" > /tmp/pipeline-status.json
            active=$(jq -r '.pipeline_active | if type == "boolean" then tostring else error("pipeline_active is not a boolean") end' /tmp/pipeline-status.json)
            stage=$(jq -r '.pipeline_stage // "unknown"' /tmp/pipeline-status.json)
            echo "Pipeline check ${attempt}/${PIPELINE_WAIT_ATTEMPTS}: active=${active} stage=${stage}"
            if [ "$active" = "false" ]; then
              exit 0
            fi
            if [ "$attempt" -lt "$PIPELINE_WAIT_ATTEMPTS" ]; then
              sleep "$PIPELINE_WAIT_INTERVAL_SEC"
            fi
          done
          echo "The pipeline is still active after ${PIPELINE_WAIT_ATTEMPTS} checks; refusing to restart production."
          exit 1

      - name: Bind release identity without starting a second deployment
        id: bind
        run: |
          echo "started=true" >> "$GITHUB_OUTPUT"
          railway variable set \
          "TRADER_KOO_GIT_SHA=${RELEASE_SHA}" \
          "TRADER_KOO_PAPER_TRADE_ENABLED=${{ steps.previous.outputs.paper_trade_enabled }}" \
          --skip-deploys \
          --service "$RAILWAY_SERVICE" \
          --environment "$RAILWAY_ENVIRONMENT"
          umask 077
          railway variable list --json --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT" > /tmp/bound-variables.json
          test "$(jq -er '.TRADER_KOO_PAPER_TRADE_ENABLED | select(. == "0" or . == "1")' /tmp/bound-variables.json)" = "${{ steps.previous.outputs.paper_trade_enabled }}"

      - name: Upload dark release and wait for Railway health gate
        id: upload
        timeout-minutes: 25
        env:
          NO_COLOR: "1"
        run: |
          # `railway up --ci` can exit 0 once build logs end, before the health
          # check finishes, so the next step owns the wait.
          set +e
          railway up --ci \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --message "dark release ${RELEASE_SHA}" \
            2>&1 | tee /tmp/railway-up.log
          up_status=${PIPESTATUS[0]}
          set -e
          deployment_id=$(grep -oE '[?&]id=[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' /tmp/railway-up.log | head -n 1 | cut -d= -f2 || true)
          if [ -n "$deployment_id" ]; then
            echo "Railway deployment id: ${deployment_id}"
            echo "id=$deployment_id" >> "$GITHUB_OUTPUT"
          fi
          exit "$up_status"

      - name: Record dark deployment
        id: deployed
        timeout-minutes: 20
        env:
          UPLOAD_DEPLOYMENT_ID: ${{ steps.upload.outputs.id }}
        run: |
          if [ -z "$UPLOAD_DEPLOYMENT_ID" ]; then
            echo "railway up printed no deployment id; refusing to guess which deployment is the release."
            exit 1
          fi
          deployment_id="$UPLOAD_DEPLOYMENT_ID"
          if jq -e --arg id "$deployment_id" 'map(.id) | index($id)' /tmp/previous-deployments.json > /dev/null; then
            echo "Deployment ${deployment_id} existed before the upload."
            exit 1
          fi
          echo "id=$deployment_id" >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 "$DEPLOYMENT_POLL_ATTEMPTS"); do
            railway deployment list --json --limit 20 --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT" > /tmp/current-deployments.json
            summary=$(jq -c --arg id "$deployment_id" \
              '.[] | select(.id == $id) | {id, status, createdAt, cliMessage: .meta.cliMessage}' \
              /tmp/current-deployments.json)
            echo "Deployment poll ${attempt}/${DEPLOYMENT_POLL_ATTEMPTS}: ${summary:-not listed yet}"
            status=""
            if [ -n "$summary" ]; then
              if ! jq -e --arg message "dark release ${RELEASE_SHA}" '.cliMessage == $message' <<< "$summary" > /dev/null; then
                echo "Deployment ${deployment_id} is not the release for ${RELEASE_SHA}."
                exit 1
              fi
              status=$(jq -r '.status' <<< "$summary")
            fi
            case "$status" in
              SUCCESS) exit 0 ;;
              FAILED|CRASHED|REMOVED|REMOVING|SKIPPED) exit 1 ;;
            esac
            sleep "$DEPLOYMENT_POLL_INTERVAL_SEC"
          done
          echo "Deployment ${deployment_id} did not reach SUCCESS within ${DEPLOYMENT_POLL_ATTEMPTS} polls."
          exit 1

      - name: Verify deployed Railway write gate
        id: deployed_config
        run: |
          umask 077
          railway variable list --json --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT" > /tmp/deployed-variables.json
          observed=$(jq -er '.TRADER_KOO_PAPER_TRADE_ENABLED | select(. == "0" or . == "1")' /tmp/deployed-variables.json)
          test "$observed" = "${{ steps.previous.outputs.paper_trade_enabled }}"
          echo "paper_trade_enabled=$observed" >> "$GITHUB_OUTPUT"

      - name: Verify API contracts and exact commit
        id: verified
        run: |
          umask 077
          python -m trader_koo.scripts.verify_deployment \
          --base-url "$BASE_URL" \
          --expected-sha "$RELEASE_SHA" \
          --api-key "$ADMIN_API_KEY" \
          --expected-campaign-status "${{ steps.previous.outputs.campaign_status }}" \
          --expected-campaign-write-state "${{ steps.previous.outputs.campaign_write_state }}" \
          > release-evidence/deployment-verification.json
          observed_write_state=$(jq -er '.observed_campaign_write_state | select(. == "enabled" or . == "paused")' release-evidence/deployment-verification.json)
          observed_status=$(jq -er '.observed_campaign_status | select(. == "active" or . == "draft" or . == "frozen")' release-evidence/deployment-verification.json)
          echo "campaign_write_state=$observed_write_state" >> "$GITHUB_OUTPUT"
          echo "campaign_status=$observed_status" >> "$GITHUB_OUTPUT"

      - name: Verify production Chromium journeys
        working-directory: trader_koo/frontend-v2
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.BASE_URL }}
          PLAYWRIGHT_EXPECTED_SHA: ${{ env.RELEASE_SHA }}
          PLAYWRIGHT_ADMIN_API_KEY: ${{ env.ADMIN_API_KEY }}
        run: npx playwright test --config=playwright.production.config.ts

      - name: Roll back code and variables after any failed release check
        id: rollback
        timeout-minutes: 25
        # Nothing to undo, and no restart to cause, until Railway was touched.
        if: ${{ (failure() || cancelled()) && steps.previous.outputs.id != '' && steps.bind.outputs.started == 'true' }}
        env:
          PREVIOUS_DEPLOYMENT_ID: ${{ steps.previous.outputs.id }}
          PREVIOUS_SHA: ${{ steps.previous.outputs.sha }}
          DARK_DEPLOYMENT_ID: ${{ steps.upload.outputs.id }}
          EXPECTED_CAMPAIGN_STATUS: ${{ steps.previous.outputs.campaign_status }}
          EXPECTED_CAMPAIGN_WRITE_STATE: ${{ steps.previous.outputs.campaign_write_state }}
          EXPECTED_PAPER_TRADE_ENABLED: ${{ steps.previous.outputs.paper_trade_enabled }}
        run: |
          umask 077
          # The response bodies are Railway errors or booleans, never the token.
          railway_graphql() {
            http_status=$(curl --silent --show-error \
              --request POST \
              --url https://backboard.railway.com/graphql/v2 \
              --header "Project-Access-Token: ${RAILWAY_TOKEN}" \
              --header "Content-Type: application/json" \
              --data-binary @"$1" \
              --output "$2" \
              --write-out '%{http_code}')
            if [ "$http_status" != "200" ] || ! jq -e '.errors == null' "$2" > /dev/null 2>&1; then
              echo "Railway GraphQL request failed with HTTP ${http_status}:"
              jq -c '{errors}' "$2" 2>/dev/null || head -c 2000 "$2"
              echo
              return 1
            fi
          }
          list_deployments() {
            railway deployment list --json --limit 50 --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT" > "$1"
            jq -c '[.[:5][] | {id, status, createdAt, cliMessage: .meta.cliMessage}]' "$1"
          }

          list_deployments /tmp/pre-rollback-deployments.json
          if [ -n "$DARK_DEPLOYMENT_ID" ]; then
            dark_status=$(jq -r --arg id "$DARK_DEPLOYMENT_ID" '.[] | select(.id == $id) | .status' /tmp/pre-rollback-deployments.json)
            case "$dark_status" in
              QUEUED|WAITING|NEEDS_APPROVAL|INITIALIZING|BUILDING|DEPLOYING)
                # An in-flight dark deployment could still pass its health
                # check after the rollback and take traffic back.
                jq -n --arg id "$DARK_DEPLOYMENT_ID" \
                  '{query: "mutation deploymentCancel($id: String!) { deploymentCancel(id: $id) }", variables: {id: $id}}' \
                  > /tmp/cancel-request.json
                if railway_graphql /tmp/cancel-request.json /tmp/cancel.json \
                  && jq -e '.data.deploymentCancel == true' /tmp/cancel.json > /dev/null; then
                  echo "Cancelled in-flight dark deployment ${DARK_DEPLOYMENT_ID} (${dark_status})."
                else
                  echo "::warning::Could not cancel dark deployment ${DARK_DEPLOYMENT_ID} (${dark_status}); the checks below still decide the rollback."
                fi
                ;;
            esac
          fi

          jq -n \
            --rawfile query ops/railway-rollback.graphql \
            --arg id "$PREVIOUS_DEPLOYMENT_ID" \
            '{query: $query, variables: {id: $id}}' \
            > /tmp/rollback-request.json
          railway_graphql /tmp/rollback-request.json /tmp/rollback.json
          # deploymentRollback returns Boolean!, not a deployment.
          jq -e '.data.deploymentRollback == true' /tmp/rollback.json > /dev/null

          rollback_id=""
          for attempt in $(seq 1 "$ROLLBACK_POLL_ATTEMPTS"); do
            echo "Rollback poll ${attempt}/${ROLLBACK_POLL_ATTEMPTS}:"
            list_deployments /tmp/rollback-deployments.json
            if [ -z "$rollback_id" ]; then
              rollback_id=$(jq -r \
                --slurpfile before /tmp/pre-rollback-deployments.json '
                  [.[] | select(.id as $id | ($before[0] | map(.id) | index($id) | not))] as $new
                  | if ($new | length) == 1 then $new[0].id
                    elif ($new | length) > 1 then "AMBIGUOUS"
                    else ""
                    end
                ' /tmp/rollback-deployments.json)
              if [ "$rollback_id" = "AMBIGUOUS" ]; then
                echo "AMBIGUOUS: more than one deployment appeared after the rollback request."
                exit 1
              fi
              # If Railway reactivates the recorded deployment instead of
              # creating a new one, accept it only after a grace period.
              if [ -z "$rollback_id" ] && [ "$attempt" -gt "$ROLLBACK_NEW_DEPLOYMENT_GRACE_POLLS" ]; then
                previous_status=$(jq -r --arg id "$PREVIOUS_DEPLOYMENT_ID" '.[] | select(.id == $id) | .status' /tmp/rollback-deployments.json)
                if [ "$previous_status" = "SUCCESS" ]; then
                  rollback_id="$PREVIOUS_DEPLOYMENT_ID"
                fi
              fi
            fi
            status=$(jq -r --arg id "$rollback_id" '.[] | select(.id == $id) | .status' /tmp/rollback-deployments.json)
            case "$status" in
              SUCCESS)
                echo "id=$rollback_id" >> "$GITHUB_OUTPUT"
                curl --fail --silent --show-error "${BASE_URL}/api/health" > /tmp/rollback-health.json
                jq -e '.ok == true' /tmp/rollback-health.json > /dev/null
                # Railway records no commit for `railway up` uploads, so the
                # public release SHA is the restored-code check.
                curl --fail --silent --show-error "${BASE_URL}/api/release" > /tmp/rollback-release.json
                jq -e --arg sha "$PREVIOUS_SHA" '.git_sha == $sha' /tmp/rollback-release.json > /dev/null
                curl --fail --silent --show-error \
                  "${BASE_URL}/api/paper-trades/summary" \
                  > /tmp/rollback-paper-summary.json
                jq -e '.ok == true' /tmp/rollback-paper-summary.json > /dev/null
                observed_status=$(jq -r '.campaign_health.status // "absent"' /tmp/rollback-paper-summary.json)
                if [ "$EXPECTED_CAMPAIGN_STATUS" = "absent" ]; then
                  test "$observed_status" = "draft"
                else
                  test "$observed_status" = "$EXPECTED_CAMPAIGN_STATUS"
                fi
                observed_write_state=$(jq -er '.campaign_health.write_state | select(. == "enabled" or . == "paused")' /tmp/rollback-paper-summary.json)
                test "$observed_write_state" = "$EXPECTED_CAMPAIGN_WRITE_STATE"
                railway variable list --json --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT" > /tmp/rollback-variables.json
                observed_gate=$(jq -er '.TRADER_KOO_PAPER_TRADE_ENABLED | select(. == "0" or . == "1")' /tmp/rollback-variables.json)
                test "$observed_gate" = "$EXPECTED_PAPER_TRADE_ENABLED"
                echo "observed_campaign_status=$observed_status" >> "$GITHUB_OUTPUT"
                echo "observed_write_state=$observed_write_state" >> "$GITHUB_OUTPUT"
                echo "paper_trade_enabled=$observed_gate" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              FAILED|CRASHED|REMOVED|REMOVING|SKIPPED)
                echo "Restored deployment ${rollback_id} ended ${status}."
                exit 1
                ;;
            esac
            sleep "$DEPLOYMENT_POLL_INTERVAL_SEC"
          done
          echo "Restored deployment ${rollback_id:-unidentified} did not reach SUCCESS within ${ROLLBACK_POLL_ATTEMPTS} polls."
          exit 1

      - name: Write deployment manifest
        if: ${{ always() }}
        run: |
          mkdir -p release-evidence
          jq -n \
            --arg schema "dark-deploy-manifest-v2" \
            --arg git_sha "$RELEASE_SHA" \
            --arg previous_deployment_id "${{ steps.previous.outputs.id }}" \
            --arg previous_git_sha "${{ steps.previous.outputs.sha }}" \
            --arg expected_campaign_status "${{ steps.previous.outputs.campaign_status }}" \
            --arg expected_campaign_write_state "${{ steps.previous.outputs.campaign_write_state }}" \
            --arg previous_paper_trade_enabled "${{ steps.previous.outputs.paper_trade_enabled }}" \
            --arg deployed_paper_trade_enabled "${{ steps.deployed_config.outputs.paper_trade_enabled }}" \
            --arg deployed_campaign_write_state "${{ steps.verified.outputs.campaign_write_state }}" \
            --arg deployed_campaign_status "${{ steps.verified.outputs.campaign_status }}" \
            --arg rollback_campaign_status "${{ steps.rollback.outputs.observed_campaign_status }}" \
            --arg rollback_campaign_write_state "${{ steps.rollback.outputs.observed_write_state }}" \
            --arg rollback_paper_trade_enabled "${{ steps.rollback.outputs.paper_trade_enabled }}" \
            --arg dark_deployment_id "${{ steps.deployed.outputs.id }}" \
            --arg rollback_deployment_id "${{ steps.rollback.outputs.id }}" \
            --arg job_status "${{ job.status }}" \
            '{schema: $schema, git_sha: $git_sha, previous_deployment_id: $previous_deployment_id, previous_git_sha: $previous_git_sha, expected_campaign_status: $expected_campaign_status, expected_campaign_write_state: $expected_campaign_write_state, previous_paper_trade_enabled: $previous_paper_trade_enabled, deployed_paper_trade_enabled: $deployed_paper_trade_enabled, deployed_campaign_status: $deployed_campaign_status, deployed_campaign_write_state: $deployed_campaign_write_state, dark_deployment_id: $dark_deployment_id, rollback_deployment_id: $rollback_deployment_id, rollback_campaign_status: $rollback_campaign_status, rollback_campaign_write_state: $rollback_campaign_write_state, rollback_paper_trade_enabled: $rollback_paper_trade_enabled, verification_status: $job_status, campaign_activation_invoked: false}' \
            > release-evidence/deployment-manifest.json

      - name: Upload deployment evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
