[build-system]
requires = ["setuptools>=45"]
build-backend = "setuptools.build_meta"

[project]
name = "trader-koo"
version = "0.2.0"
description = "Full-stack market analysis platform with ML-powered swing-trade research workflows."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Haoming Koo" }]

[project.urls]
Homepage = "https://trader.kooexperience.com"
Repository = "https://github.com/haomingkoo/trader-koo"
Documentation = "https://github.com/haomingkoo/trader-koo/blob/main/ARCHITECTURE.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["trader_koo*"]

[tool.setuptools.package-data]
"trader_koo.research" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
markers = [
    "asyncio: marks tests that require an asyncio event loop",
]

[tool.mutmut]
# ops/mutation_gate.py rewrites only_mutate and the test selection per run.
source_paths = ["trader_koo"]
only_mutate = [
    "trader_koo/report/freshness.py",
]
# Log statements are diagnostics, not asserted behaviour.
do_not_mutate_patterns = ['^\s*(LOG|logger)\.(debug|info|warning|error|exception|critical)\(']
# Tests run from mutants/, so copy what they read from the repo root.
also_copy = [
    "tests", "config", "ops", "docs", ".github", ".railway", ".importlinter",
    "pyproject.toml", "Makefile", "start.sh", "build.sh", "nixpacks.toml",
    "requirements.txt", "requirements-dev.txt", ".env.example",
    "ARCHITECTURE.md", "DEPLOYMENT.md", "README.md", "CLAUDE.md", "RESEARCH_STATUS.md",
    "paper-schema-contract-v5.json",
    "release-database-copy-v2.schema.json", "release-database-copy-v3.schema.json",
    "release-database-copy-v4.schema.json", "release-database-copy-v5.schema.json",
]
pytest_add_cli_args = ["-p", "no:cacheprovider", "-q", "-x"]
pytest_add_cli_args_test_selection = [
    "tests/test_data_freshness.py",
]

# Equivalent mutants leave the mutation gate's denominator (ops/mutation_gate.py).
[tool.mutation_gate]
sql_case = true
log_calls = true
help_text = true
equivalent = [
    { file = "trader_koo/backend/services/pipeline.py", function = "x__infer_pipeline_from_log_tail", original = "if weekly_report_start_idx >= 0 and weekly_report_start_idx > weekly_report_terminal_idx:", mutated = "if weekly_report_start_idx >= 0 and weekly_report_start_idx >= weekly_report_terminal_idx:", reason = "two distinct log markers never share a line, so the indices are equal only when both are -1" },
    { file = "trader_koo/backend/services/pipeline.py", function = "x__infer_pipeline_from_log_tail", original = "if weekly_start_idx >= 0 and weekly_start_idx > weekly_yolo_terminal_idx:", mutated = "if weekly_start_idx >= 0 and weekly_start_idx >= weekly_yolo_terminal_idx:", reason = "two distinct log markers never share a line, so the indices are equal only when both are -1" },
    { file = "trader_koo/backend/services/pipeline.py", function = "x__infer_pipeline_from_log_tail", original = "out[\"stage_line\"] = tail[yolo_progress_idx] if yolo_progress_idx > weekly_start_idx else tail[weekly_start_idx]", mutated = "out[\"stage_line\"] = tail[yolo_progress_idx] if yolo_progress_idx >= weekly_start_idx else tail[weekly_start_idx]", reason = "two distinct log markers never share a line, so the indices are equal only when both are -1" },
    { file = "trader_koo/backend/services/pipeline.py", function = "x__infer_pipeline_from_log_tail", original = "if report_start_idx >= 0 and report_start_idx > report_done_idx:", mutated = "if report_start_idx >= 0 and report_start_idx >= report_done_idx:", reason = "two distinct log markers never share a line, so the indices are equal only when both are -1" },
    { file = "trader_koo/backend/services/pipeline.py", function = "x__infer_pipeline_from_log_tail", original = "if yolo_progress_idx >= 0 and yolo_progress_idx > yolo_done_idx:", mutated = "if yolo_progress_idx >= 0 and yolo_progress_idx >= yolo_done_idx:", reason = "two distinct log markers never share a line, so the indices are equal only when both are -1" },
    { file = "trader_koo/backend/services/pipeline.py", function = "x__infer_pipeline_from_log_tail", original = "if done_idx > start_idx:", mutated = "if done_idx >= start_idx:", reason = "two distinct log markers never share a line, so the indices are equal only when both are -1" },
    { file = "trader_koo/backend/services/pipeline.py", function = "x__infer_pipeline_from_log_tail", original = "if report_start >= 0 and report_start > report_done:", mutated = "if report_start >= 0 and report_start >= report_done:", reason = "two distinct log markers never share a line, so the indices are equal only when both are -1" },
    { file = "trader_koo/backend/services/pipeline.py", function = "x__infer_pipeline_from_log_tail", original = "elif (yolo_start >= 0 and yolo_start > yolo_done) or (yolo_progress >= 0 and yolo_progress > yolo_done):", mutated = "elif (yolo_start >= 0 and yolo_start >= yolo_done) or (yolo_progress >= 0 and yolo_progress > yolo_done):", reason = "two distinct log markers never share a line, so the indices are equal only when both are -1" },
    { file = "trader_koo/backend/services/pipeline.py", function = "x__infer_pipeline_from_log_tail", original = "elif (yolo_start >= 0 and yolo_start > yolo_done) or (yolo_progress >= 0 and yolo_progress > yolo_done):", mutated = "elif (yolo_start >= 0 and yolo_start > yolo_done) or (yolo_progress >= 0 and yolo_progress >= yolo_done):", reason = "two distinct log markers never share a line, so the indices are equal only when both are -1" },
    { file = "trader_koo/backend/services/pipeline.py", function = "x__infer_pipeline_from_log_tail", original = "if report_start >= 0 and report_start > report_done:", mutated = "if report_start > 0 and report_start > report_done:", reason = "block[0] is always the run's START line, which holds no stage marker" },
    { file = "trader_koo/backend/services/pipeline.py", function = "x__infer_pipeline_from_log_tail", original = "if report_start >= 0 and report_start > report_done:", mutated = "if report_start >= 1 and report_start > report_done:", reason = "block[0] is always the run's START line, which holds no stage marker" },
    { file = "trader_koo/backend/services/pipeline.py", function = "x__infer_pipeline_from_log_tail", original = "elif (yolo_start >= 0 and yolo_start > yolo_done) or (yolo_progress >= 0 and yolo_progress > yolo_done):", mutated = "elif (yolo_start > 0 and yolo_start > yolo_done) or (yolo_progress >= 0 and yolo_progress > yolo_done):", reason = "block[0] is always the run's START line, which holds no stage marker" },
    { file = "trader_koo/backend/services/pipeline.py", function = "x__infer_pipeline_from_log_tail", original = "elif (yolo_start >= 0 and yolo_start > yolo_done) or (yolo_progress >= 0 and yolo_progress > yolo_done):", mutated = "elif (yolo_start >= 1 and yolo_start > yolo_done) or (yolo_progress >= 0 and yolo_progress > yolo_done):", reason = "block[0] is always the run's START line, which holds no stage marker" },
    { file = "trader_koo/backend/services/pipeline.py", function = "x__infer_pipeline_from_log_tail", original = "elif (yolo_start >= 0 and yolo_start > yolo_done) or (yolo_progress >= 0 and yolo_progress > yolo_done):", mutated = "elif (yolo_start >= 0 and yolo_start > yolo_done) or (yolo_progress > 0 and yolo_progress > yolo_done):", reason = "block[0] is always the run's START line, which holds no stage marker" },
    { file = "trader_koo/backend/services/pipeline.py", function = "x__infer_pipeline_from_log_tail", original = "elif (yolo_start >= 0 and yolo_start > yolo_done) or (yolo_progress >= 0 and yolo_progress > yolo_done):", mutated = "elif (yolo_start >= 0 and yolo_start > yolo_done) or (yolo_progress >= 1 and yolo_progress > yolo_done):", reason = "block[0] is always the run's START line, which holds no stage marker" },
    { file = "trader_koo/backend/services/pipeline.py", function = "x__infer_pipeline_from_log_tail", original = "out[\"stage_line\"] = block[yolo_progress] if yolo_progress >= 0 else block[yolo_start]", mutated = "out[\"stage_line\"] = block[yolo_progress] if yolo_progress > 0 else block[yolo_start]", reason = "block[0] is always the run's START line, which holds no stage marker" },
    { file = "trader_koo/backend/services/pipeline.py", function = "x__infer_pipeline_from_log_tail", original = "out[\"stage_line\"] = block[yolo_progress] if yolo_progress >= 0 else block[yolo_start]", mutated = "out[\"stage_line\"] = block[yolo_progress] if yolo_progress >= 1 else block[yolo_start]", reason = "block[0] is always the run's START line, which holds no stage marker" },
    { file = "trader_koo/backend/services/pipeline.py", function = "x__infer_pipeline_from_log_tail", original = "out[\"stage_line\"] = block[0] if block else None", mutated = "out[\"stage_line\"] = block[0] if (block) or True else None", reason = "the block always contains its START line, so it is never empty" },
