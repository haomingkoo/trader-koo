    { file = "trader_koo/backend/services/run_log.py", function = "x_stage_results", original = "block = latest_run_block(read_tail()) if (run_ingest or run_yolo) else []", mutated = "block = latest_run_block(read_tail()) if (run_ingest or run_yolo) or True else []", reason = "report-only mode never reads the block, so building it changes no result" },
