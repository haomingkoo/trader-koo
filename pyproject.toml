    { file = "trader_koo/report/runs.py", function = "x_complete_report_run", original = "if generated < _utc(row[2], field=\"started_ts\"):", mutated = "if generated < _utc(row[2], field=\"XXstarted_tsXX\"):", reason = "started_ts is validated by start_report_run and frozen by the report_runs triggers, so this re-parse never fails" },
