    { file = "trader_koo/scripts/run_yolo_patterns.py", function = "x_main", original = "default=\"\",", mutated = "default=None,", reason = "main() reads the run id as (args.run_id or ''), so a None default behaves like ''" },
    { file = "trader_koo/scripts/run_yolo_patterns.py", function = "x_main", original = "default=\"\",", mutated = "", reason = "main() reads the run id as (args.run_id or ''), so a None default behaves like ''" },
    { file = "trader_koo/report/runs.py", function = "x_complete_report_run", original = "generated_ts = str(artifact_report.get(\"generated_ts\") or \"\")", mutated = "generated_ts = str(artifact_report.get(\"generated_ts\") or \"XXXX\")", reason = "a missing value fails the same check whether it defaults to '' or 'XXXX' (run ids are UUIDs)" },
