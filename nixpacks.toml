providers = ["python"]

[variables]
PYTHON_VERSION = "3.11"

# One pinned nixpkgs revision (nixos-26.05) supplies Python 3.11.16 and Node
# 22.23.4, whatever nixpacks version Railway runs. Keep Python and Node on the
# same revision: a newer Node loaded against this phase's older libstdc++ (the
# nixLibs below go on LD_LIBRARY_PATH) fails to start. build.sh fails if Node
# differs from trader_koo/frontend-v2/.nvmrc.
[phases.setup]
nixPkgs = ["python311", "gcc", "nodejs_22"]
nixLibs = ["gcc-unwrapped", "zlib"]
nixpkgsArchive = "718f670e845328e9c2cecdd832835712b2cbd065"

# Install exactly the hashed lock; see DEPLOYMENT.md, "Python dependency lock".
[phases.install]
cmds = ["python -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install --no-deps --require-hashes -r requirements.txt"]
paths = ["/opt/venv/bin"]
cacheDirectories = ["/root/.cache/pip"]
